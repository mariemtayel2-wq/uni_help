    sdk: flutter

  cupertino_icons: ^1.0.8
  animate_do: ^5.1.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^7.3.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0
  flutter_svg: ^2.2.0
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  injectable: ^3.0.0
  flutter_native_splash: ^2.4.8
  google_fonts: ^8.2.0
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0
  carousel_slider: ^5.1.2
  # image_picker: ^1.2.3
  flutter_secure_storage: ^10.3.1
  toastification: ^3.2.0
  flutter_launcher_icons: ^0.14.4
  dartz: ^0.10.1
  firebase_core: ^4.15.0
  font_awesome_flutter: ^11.0.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  path: ^1.9.1
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  firebase_storage: ^13.6.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  equatable: ^2.1.0
  flutter_local_notifications: ^22.3.1
  intl: ^0.20.3
  timeago: ^3.7.1
  firebase_database: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#F8F9FA"
  remove_alpha_ios: true

