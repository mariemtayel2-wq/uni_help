name: uni_help
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animate_do: ^5.1.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^7.3.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0
  flutter_svg: ^2.2.0
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  injectable: ^3.0.0
  flutter_native_splash: ^2.4.8
  google_fonts: ^8.2.0
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0
  carousel_slider: ^5.1.2
  # image_picker: ^1.2.3
  flutter_secure_storage: ^10.3.1
  toastification: ^3.2.0
  flutter_launcher_icons: ^0.14.4
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#F8F9FA"
  remove_alpha_ios: true

# flutter_native_splash:
#   color: "#4F47E6"
#   image: "assets/images/splash.png"

#   android: true
#   ios: true
#   web: false

#   android_12:
#     color: "#4F47E6"
#     image: "assets/images/splash.png"
#     icon_background_color: "#4F47E6"

# بعد ما تحطي الصور في المسارات دي، شغّلي الأوامر دي مرة واحدة:
# dart run flutter_launcher_icons
# dart run flutter_native_splash:create

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg